<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Database Interface</title>
</head>
<body>
    <h1>{{ message }}</h1>

    <h2>Insert New Patient</h2>
    <form action="/insert" method="post">
        <label>Name:</label>
        <input type="text" name="name" required><br><br>a
        <label>Age:</label>
        <input type="number" name="age" required><br><br>
        <label>Gender:</label>
        <input type="text" name="gender" required><br><br>
        <label>Diagnosis:</label>
        <input type="text" name="diagnosis" required><br><br>
        <button type="submit">Insert Patient</button>
    </form>

    <h2>Delete Patient</h2>
    <form action="/delete" method="post">
        <label>Patient ID:</label>
        <input type="number" name="patient_id" required><br><br>
        <button type="submit">Delete Patient</button>
    </form>
</body>
</html>
